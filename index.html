<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<meta name="color-scheme" content="dark">
<title>Cronómetro con silbato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090f;
    --fg: #f4f6fb;
    --muted: rgba(244,246,251,.58);
    --glass: rgba(255,255,255,.055);
    --stroke: rgba(255,255,255,.1);
    --track: rgba(255,255,255,.08);
    --tick: rgba(255,255,255,.22);
    --g1: #ffb04a;
    --g2: #ff5a2b;
    --accent: #ff7a33;
    --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body.done {
    --fg: #14070a;
    --muted: rgba(20,7,10,.66);
    --glass: rgba(20,7,10,.12);
    --stroke: rgba(20,7,10,.2);
    --track: rgba(20,7,10,.14);
    --tick: rgba(20,7,10,.32);
    --g1: #14070a;
    --g2: #14070a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-weight: 500;
    display: flex;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    transition: background .5s ease, color .4s ease;
  }
  body::before {
    content: "";
    position: fixed; inset: -10%;
    background:
      radial-gradient(60% 45% at 50% 30%, rgba(255,106,40,.24), transparent 70%),
      radial-gradient(50% 40% at 88% 96%, rgba(80,92,255,.18), transparent 70%);
    opacity: .75;
    transition: opacity .6s ease;
    pointer-events: none;
  }
  body[data-state="running"]::before { opacity: 1; }
  body.done { background: linear-gradient(160deg, #ff8a3d 0%, #ff3f5e 100%); }
  body.done::before { opacity: 0; }

  main {
    position: relative;
    width: 100%; max-width: 440px;
    min-height: 100dvh;
    padding: 18px 22px 26px;
    display: flex; flex-direction: column; gap: 18px;
  }

  /* Cabecera */
  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 36px; height: 36px; border-radius: 11px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #ff8a3d, #ff4d2e);
    box-shadow: 0 6px 18px -6px rgba(255,90,40,.8), inset 0 1px 0 rgba(255,255,255,.35);
    color: #fff;
  }
  body.done .logo { background: #14070a; box-shadow: none; }
  .brand b { font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; }
  .brand small { display: block; font-size: .72rem; color: var(--muted); font-weight: 500; margin-top: 1px; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 14px;
    display: grid; place-items: center;
    background: var(--glass); border: 1px solid var(--stroke);
    color: var(--fg); cursor: pointer;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Anillo */
  .dial { position: relative; width: min(84vw, 340px); aspect-ratio: 1; margin: 6px auto 0; }
  .dial svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .track { fill: none; stroke: var(--track); stroke-width: 8; }
  .progress {
    fill: none; stroke: url(#grad); stroke-width: 8; stroke-linecap: round;
    transition: stroke-dashoffset .12s linear;
    filter: drop-shadow(0 0 10px rgba(255,110,50,.55));
  }
  .knob { transform-origin: 50% 50%; transform-box: view-box; transition: transform .12s linear; }
  .knob circle { fill: #fff; filter: drop-shadow(0 0 8px rgba(255,150,80,.9)); }
  .tick { stroke: var(--tick); stroke-linecap: round; }
  body.done .progress { stroke-dashoffset: 0 !important; opacity: 1 !important; filter: none; }
  body.done .knob { opacity: 0 !important; }

  .readout {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    text-align: center;
  }
  .time {
    font-weight: 300;
    font-size: clamp(3.9rem, 21vw, 5.9rem);
    letter-spacing: -.03em; line-height: 1;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  .status {
    font-size: .74rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); min-height: 1.2em;
  }
  body.done .time { animation: pop .55s ease-in-out 3; }
  @keyframes pop { 50% { transform: scale(1.07); } }

  /* Tarjeta de tiempo */
  .setter {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    background: var(--glass); border: 1px solid var(--stroke);
    border-radius: 24px; padding: 10px 8px;
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    transition: opacity .3s;
  }
  .setter label { display: flex; flex-direction: column; align-items: center; gap: 0; }
  .setter span.cap { font-size: .66rem; font-weight: 700; letter-spacing: .18em; color: var(--muted); }
  .setter input {
    width: 100%; max-width: 130px; height: 58px;
    background: transparent; border: 0; color: var(--fg);
    font: 300 2.6rem/1 var(--font); text-align: center; font-variant-numeric: tabular-nums;
    -moz-appearance: textfield; appearance: textfield;
  }
  .setter input::-webkit-outer-spin-button,
  .setter input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .setter .sep { font-size: 2.2rem; font-weight: 300; color: var(--muted); padding-top: 14px; }
  .locked { opacity: .4; pointer-events: none; }

  /* Atajos */
  .presets {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px;
    justify-content: safe center; scrollbar-width: none; transition: opacity .3s;
  }
  .presets::-webkit-scrollbar { display: none; }
  .presets button {
    flex: none; height: 40px; padding: 0 18px; border-radius: 999px;
    font: 600 .9rem var(--font); color: var(--fg);
    background: var(--glass); border: 1px solid var(--stroke);
    cursor: pointer;
  }
  .presets button:active { transform: scale(.96); }

  /* Controles */
  .controls { display: flex; align-items: flex-start; justify-content: center; gap: 26px; margin-top: auto; padding-top: 6px; }
  .ctl {
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    background: none; border: 0; padding: 0; color: var(--fg);
    font: inherit; cursor: pointer; position: relative;
  }
  .ctl input { position: absolute; opacity: 0; width: 100%; height: 64px; margin: 0; cursor: pointer; }
  .ctl .orb {
    width: 64px; height: 64px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--glass); border: 1px solid var(--stroke);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    margin-top: 16px;
    transition: transform .15s, background .2s, border-color .2s;
  }
  .ctl .cap { font-size: .74rem; font-weight: 600; color: var(--muted); }
  .ctl:active .orb { transform: scale(.94); }
  .ctl.main .orb {
    width: 96px; height: 96px; margin-top: 0; border: 0; color: #fff;
    background: linear-gradient(145deg, #ff8f40, #ff4a2c);
    box-shadow: 0 14px 44px -10px rgba(255,90,40,.85), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .ctl.main svg.i { width: 36px; height: 36px; fill: currentColor; stroke: none; }
  body.done .ctl.main .orb { background: #14070a; color: #fff; box-shadow: 0 14px 40px -12px rgba(20,7,10,.6); }
  .ctl.main .pause { display: none; }
  body[data-state="running"] .ctl.main .play { display: none; }
  body[data-state="running"] .ctl.main .pause { display: block; }
  .ctl input:checked + .orb {
    background: rgba(255,122,51,.2); border-color: var(--accent); color: #ffa468;
    box-shadow: 0 0 24px -4px rgba(255,122,51,.6);
  }
  body.done .ctl input:checked + .orb { background: #14070a; border-color: #14070a; color: #fff; box-shadow: none; }

  button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 12px; }
  .ctl input:focus-visible + .orb { outline: 2px solid #fff; outline-offset: 3px; }
  body.done button:focus-visible, body.done input:focus-visible { outline-color: #14070a; }

  @media (max-height: 700px) {
    main { gap: 12px; }
    .dial { width: min(70vw, 280px); }
  }
  @media (prefers-reduced-motion: reduce) {
    body.done .time { animation: none; }
    .progress, .knob, body, body::before { transition: none; }
  }
</style>
</head>
<body data-state="idle">
<main>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="14.5" r="5.5"/><path d="M13.8 10.5H21v3.6h-7.4"/><path d="M9 3.5v3"/></svg>
      </div>
      <div><b>Silbato</b><small>Cronómetro de entrenamiento</small></div>
    </div>
    <button class="icon-btn" id="test" type="button" aria-label="Probar silbato" title="Probar silbato">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>
    </button>
  </header>

  <section class="dial">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <defs>
        <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="220" y2="220">
          <stop offset="0" style="stop-color:var(--g1)"/>
          <stop offset="1" style="stop-color:var(--g2)"/>
        </linearGradient>
      </defs>
      <g id="ticks"></g>
      <g transform="rotate(-90 120 120)">
        <circle class="track" cx="120" cy="120" r="104"/>
        <circle class="progress" id="ring" cx="120" cy="120" r="104"/>
        <g class="knob" id="knob"><circle cx="224" cy="120" r="6.5"/></g>
      </g>
    </svg>
    <div class="readout">
      <div class="time" id="time" role="timer">01:00</div>
      <div class="status" id="status">Listo</div>
    </div>
  </section>

  <div class="setter" id="setter">
    <label><input id="min" type="number" inputmode="numeric" min="0" max="999" value="1" aria-label="Minutos"><span class="cap">MIN</span></label>
    <span class="sep">:</span>
    <label><input id="sec" type="number" inputmode="numeric" min="0" max="59" value="0" aria-label="Segundos"><span class="cap">SEG</span></label>
  </div>

  <div class="presets" id="presets">
    <button type="button" data-s="30">30 s</button>
    <button type="button" data-s="60">1 min</button>
    <button type="button" data-s="120">2 min</button>
    <button type="button" data-s="180">3 min</button>
    <button type="button" data-s="300">5 min</button>
    <button type="button" data-s="600">10 min</button>
  </div>

  <div class="controls">
    <button class="ctl" id="reset" type="button" aria-label="Reiniciar">
      <span class="orb"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.6h4.6"/></svg></span>
      <span class="cap">Reiniciar</span>
    </button>
    <button class="ctl main" id="start" type="button" aria-label="Empezar">
      <span class="orb">
        <svg class="i play" viewBox="0 0 24 24"><path d="M8.5 5.2v13.6a.6.6 0 0 0 .9.5l10.8-6.8a.6.6 0 0 0 0-1L9.4 4.7a.6.6 0 0 0-.9.5z"/></svg>
        <svg class="i pause" viewBox="0 0 24 24"><rect x="6.2" y="4.8" width="4.2" height="14.4" rx="1.4"/><rect x="13.6" y="4.8" width="4.2" height="14.4" rx="1.4"/></svg>
      </span>
      <span class="cap" id="startLabel">Empezar</span>
    </button>
    <label class="ctl" id="repeatCtl">
      <input type="checkbox" id="repeat" aria-label="Repetir al terminar">
      <span class="orb"><svg class="i" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/></svg></span>
      <span class="cap">Repetir</span>
    </label>
  </div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var timeEl = $('time'), statusEl = $('status'), ring = $('ring'), knob = $('knob');
  var minEl = $('min'), secEl = $('sec'), startBtn = $('start'), resetBtn = $('reset');
  var repeatEl = $('repeat'), startLabel = $('startLabel');
  var setter = $('setter'), presets = $('presets');

  var R = 104, C = 2 * Math.PI * R;
  ring.style.strokeDasharray = C;
  ring.style.strokeDashoffset = 0;

  // Marcas del reloj alrededor del anillo
  (function ticks() {
    var g = $('ticks'), ns = 'http://www.w3.org/2000/svg';
    for (var i = 0; i < 60; i++) {
      var major = i % 5 === 0;
      var l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', 120); l.setAttribute('x2', 120);
      l.setAttribute('y1', 2); l.setAttribute('y2', major ? 8 : 5);
      l.setAttribute('class', 'tick');
      l.setAttribute('stroke-width', major ? 2 : 1.2);
      l.setAttribute('transform', 'rotate(' + (i * 6) + ' 120 120)');
      g.appendChild(l);
    }
  })();

  var state = 'idle';           // idle | running | paused | done
  var totalMs = 60000, remainingMs = 60000, endAt = 0, tick = null, wakeLock = null;

  // ---------- Silbato ----------
  var ctx = null;
  function audio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // Silbato sintetizado (respaldo si no hay whistle.mp3)
  function blast(t0, dur) {
    var c = ctx;
    var master = c.createGain();
    master.gain.setValueAtTime(0.0001, t0);
    master.gain.exponentialRampToValueAtTime(0.9, t0 + 0.02);
    master.gain.setValueAtTime(0.9, t0 + dur - 0.05);
    master.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    master.connect(c.destination);

    var osc = c.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 2850;
    var lfo = c.createOscillator();
    lfo.frequency.value = 38;
    var lfoGain = c.createGain();
    lfoGain.gain.value = 240;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    osc.connect(master);

    var len = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    var noise = c.createBufferSource();
    noise.buffer = buf;
    var bp = c.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 3300;
    bp.Q.value = 1.4;
    var ng = c.createGain();
    ng.gain.value = 0.28;
    noise.connect(bp); bp.connect(ng); ng.connect(master);

    osc.start(t0); lfo.start(t0); noise.start(t0);
    osc.stop(t0 + dur); lfo.stop(t0 + dur); noise.stop(t0 + dur);
  }

  // Silbato real: si existe whistle.mp3 junto al index.html se usa ese.
  var realBuffer = null, realTried = false;
  function loadReal() {
    if (realTried || !ctx) return;
    realTried = true;
    fetch('whistle.mp3')
      .then(function (r) { if (!r.ok) throw new Error('sin archivo'); return r.arrayBuffer(); })
      .then(function (ab) {
        return new Promise(function (ok, fail) { ctx.decodeAudioData(ab, ok, fail); });
      })
      .then(function (b) { realBuffer = b; })
      .catch(function () { realBuffer = null; });
  }

  function whistle() {
    var c = audio();
    if (!c) return;
    loadReal();
    if (realBuffer) {
      var src = c.createBufferSource();
      var g = c.createGain();
      g.gain.value = 1;
      src.buffer = realBuffer;
      src.connect(g);
      g.connect(c.destination);
      src.start();
      if (navigator.vibrate) navigator.vibrate([250, 100, 250, 100, 900]);
      return;
    }
    var t = c.currentTime + 0.05;
    blast(t, 0.25);
    blast(t + 0.35, 0.25);
    blast(t + 0.70, 0.95);
    if (navigator.vibrate) navigator.vibrate([250, 100, 250, 100, 900]);
  }

  // ---------- Pantalla encendida mientras corre ----------
  function keepAwake() {
    try {
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
      }
    } catch (e) {}
  }
  function release() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && state === 'running') keepAwake();
  });

  // ---------- Pantalla ----------
  function fmt(ms) {
    var s = Math.ceil(ms / 1000);
    var m = Math.floor(s / 60);
    var r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }

  function draw() {
    timeEl.textContent = fmt(remainingMs);
    var frac = totalMs > 0 ? Math.max(0, Math.min(1, remainingMs / totalMs)) : 0;
    ring.style.strokeDashoffset = C * (1 - frac);
    ring.style.opacity = frac > 0 ? 1 : 0;
    knob.style.opacity = frac > 0 ? 1 : 0;
    knob.style.transform = 'rotate(' + (frac * 360) + 'deg)';
    document.title = state === 'running' ? fmt(remainingMs) + ' · Cronómetro' : 'Cronómetro con silbato';
  }

  function readInputs() {
    var m = Math.max(0, Math.min(999, parseInt(minEl.value, 10) || 0));
    var s = Math.max(0, Math.min(59, parseInt(secEl.value, 10) || 0));
    return (m * 60 + s) * 1000;
  }

  function setInputs(seconds) {
    minEl.value = Math.floor(seconds / 60);
    secEl.value = seconds % 60;
  }

  function setState(s) {
    state = s;
    document.body.dataset.state = s;
    document.body.classList.toggle('done', s === 'done');
    var busy = (s === 'running' || s === 'paused');
    setter.classList.toggle('locked', busy);
    presets.classList.toggle('locked', busy);
    minEl.disabled = secEl.disabled = busy;
    var labels = { idle: 'Empezar', running: 'Pausar', paused: 'Seguir', done: 'Otra vez' };
    var texts = { idle: 'Listo', running: 'En marcha', paused: 'En pausa', done: '¡Tiempo!' };
    startLabel.textContent = labels[s];
    startBtn.setAttribute('aria-label', labels[s]);
    statusEl.textContent = texts[s];
  }

  // ---------- Lógica ----------
  function loop() {
    remainingMs = endAt - Date.now();
    if (remainingMs <= 0) { finish(); return; }
    draw();
  }

  function run() {
    endAt = Date.now() + remainingMs;
    clearInterval(tick);
    tick = setInterval(loop, 100);
    keepAwake();
    setState('running');
    draw();
  }

  function finish() {
    clearInterval(tick);
    remainingMs = 0;
    draw();
    release();
    setState('done');
    whistle();
    if (repeatEl.checked) {
      setTimeout(function () {
        if (state !== 'done') return;
        remainingMs = totalMs;
        run();
      }, 2200);
    }
  }

  function start() {
    audio();
    loadReal();
    if (state === 'idle' || state === 'done') {
      totalMs = readInputs();
      if (totalMs <= 0) { statusEl.textContent = 'Poné un tiempo'; return; }
      remainingMs = totalMs;
      run();
    } else if (state === 'paused') {
      run();
    } else if (state === 'running') {
      clearInterval(tick);
      remainingMs = Math.max(0, endAt - Date.now());
      release();
      setState('paused');
      draw();
    }
  }

  function reset() {
    clearInterval(tick);
    release();
    totalMs = readInputs() || 60000;
    remainingMs = totalMs;
    setState('idle');
    draw();
  }

  startBtn.addEventListener('click', start);
  resetBtn.addEventListener('click', reset);
  $('test').addEventListener('click', whistle);

  presets.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || state === 'running' || state === 'paused') return;
    setInputs(parseInt(b.dataset.s, 10));
    reset();
  });

  [minEl, secEl].forEach(function (el) {
    el.addEventListener('input', function () {
      if (state === 'idle' || state === 'done') {
        totalMs = remainingMs = readInputs();
        if (state === 'done') setState('idle');
        draw();
      }
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !/INPUT|BUTTON/.test(document.activeElement.tagName)) {
      e.preventDefault(); start();
    }
  });

  totalMs = remainingMs = readInputs();
  setState('idle');
  draw();
})();
</script>
</body>
</html>
